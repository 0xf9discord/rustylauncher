[package]
name = "rustylauncher"
version = "0.1.0"
edition = "2024"
description = "A small, native Minecraft Java launcher built with Rust and GPUI"
license = "MIT"

[dependencies]
anyhow = "1"
async-channel = "2"
gpui = "=0.2.2"
rayon = "1.11"
regex = "1"
roxmltree = "0.20"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

